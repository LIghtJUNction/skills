name: Catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:23 UTC / 10:23 Asia/Taipei, daily.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/catalog.py check

  refresh:
    if: >-
      github.repository == 'LIghtJUNction/skills' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: catalog-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh public repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/catalog.py refresh
      - name: Validate before publishing
        run: |
          python -m unittest discover -s tests -v
          python scripts/catalog.py check
          git diff --check
      - name: Commit changed catalog
        run: |
          git add README.md CATALOG.md data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public skills catalog'
          git push origin HEAD:main
